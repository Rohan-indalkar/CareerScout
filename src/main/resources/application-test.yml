spring:
  datasource:
    url: jdbc:h2:mem:careerscout-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  jwt:
    secret: test-only-signing-key-do-not-use-outside-tests-123456
  crawler:
    scheduler:
      initial-delay: PT24H
      poll-interval: PT24H

management:
  health:
    db:
      enabled: false
