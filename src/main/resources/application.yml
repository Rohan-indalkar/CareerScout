server:
  port: ${PORT:8080}

spring:
  application:
    name: careerscout-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: CareerScout API
    description: Career page job monitoring and matching
    version: 0.0.1-SNAPSHOT

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:P7D}
